[tox]
requires =
    tox>=4
env_list = py313, lint, format, typecheck
skip_missing_interpreters = true

[testenv]
skip_install = true

[testenv:py313]
description = run tests
skip_install = true
allowlist_externals = poetry
setenv =
    POETRY_VIRTUALENVS_CREATE = false
deps =
    pytest
    pytest-randomly
commands_pre =
    poetry install --no-root
commands =
    pytest --strict-markers {posargs}

[testenv:lint]
description = Lint using flake8
skip_install = true
deps =
    flake8
commands =
    flake8 src tests

[testenv:format]
description = Check formatting using black, isort, autoflake
skip_install = true
deps =
    black
    isort
    autoflake
commands =
    black --check src tests
    isort --check-only src tests
    autoflake --check --quiet -r src tests

[testenv:typecheck]
description = Type-check using mypy
skip_install = true
allowlist_externals = poetry
setenv =
    POETRY_VIRTUALENVS_CREATE = false
deps =
    mypy
commands_pre =
    poetry install --no-root
commands =
    mypy src tests
